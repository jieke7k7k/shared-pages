<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>底部栏改小 · 样品</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f4; color: #18181b; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .page { max-width: 480px; margin: 0 auto; padding: 20px 0 40px; }
  .pad { padding: 0 16px; }
  h1 { font-size: 20px; font-weight: 700; }
  .sub { margin-top: 6px; font-size: 13px; line-height: 1.6; color: #52525b; }
  .sub b { color: #18181b; }

  .switch { display: flex; gap: 8px; margin: 16px 0 12px; }
  .switch button {
    flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid #d4d4d8;
    background: #fff; font-size: 13px; font-weight: 600; color: #52525b; cursor: pointer;
  }
  .switch button.on { background: #8c6246; border-color: #8c6246; color: #fff; }
  .switch button small { display: block; margin-top: 2px; font-size: 11px; font-weight: 400; opacity: .85; }

  .phone {
    width: 375px; max-width: 100%; margin: 0 auto; background: #fafafa;
    border: 1px solid #d4d4d8; border-radius: 24px; overflow: hidden;
  }
  @media (max-width: 400px) {
    .phone { border-left: 0; border-right: 0; border-radius: 0; }
  }
  .appbar {
    height: 48px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: #fafafa; font-size: 15px; font-weight: 600;
  }
  .appbar .dots { font-size: 16px; letter-spacing: 2px; color: #71717a; }

  .weekhead { display: grid; grid-template-columns: 34px repeat(7, 1fr); background: #fafafa; }
  .weekhead span { text-align: center; font-size: 11px; color: #71717a; padding: 4px 0; }
  .weekhead span.today { color: #8c6246; font-weight: 700; }

  .grid { display: grid; grid-template-columns: 34px repeat(7, 1fr); grid-auto-rows: 44px; background: #fafafa; }
  .grid .t { font-size: 10px; color: #a1a1aa; text-align: center; padding-top: 4px; line-height: 1.3; }
  .grid .c { border-top: 1px solid #e4e4e7; border-left: 1px solid #f0f0f0; }
  .course {
    margin: 1px; border-radius: 6px; padding: 3px 4px; font-size: 10px; line-height: 1.35;
    overflow: hidden; color: #3f3f46;
  }
  .course b { display: block; font-size: 10px; }
  .c-green { background: #d9ead3; } .c-blue { background: #d0e2f2; } .c-purple { background: #e3d9f2; }

  /* ---- 底部栏（三种形态由 .phone 的 data-variant 控制） ---- */
  .tabbar { position: relative; width: 100%; background: #fff; border-top: .5px solid #e4e4e7; }
  .tabbar .row { position: relative; height: 100%; margin: 0 auto; }
  .tab {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: none; border: 0; cursor: pointer; color: #8a8a8e; padding: 0;
  }
  .tab .lbl { font-weight: 400; white-space: nowrap; }
  .tab.sel { color: #8c6246; }
  .tab.sel .lbl { font-weight: 600; }
  .pill {
    position: absolute; background: #8c6246; border-radius: 99px;
    transition: left .32s cubic-bezier(.2,.8,.2,1);
  }

  /* 现状 A：64dp，两键各占一半 */
  .phone[data-variant="a"] .tabbar { height: 64px; }
  .phone[data-variant="a"] .row { width: 100%; display: flex; }
  .phone[data-variant="a"] .tab { flex: 1; }
  .phone[data-variant="a"] .tab svg { width: 23px; height: 23px; }
  .phone[data-variant="a"] .tab .gap { height: 4px; }
  .phone[data-variant="a"] .tab .lbl { font-size: 11.5px; }
  .phone[data-variant="a"] .pill { width: 20px; height: 3px; bottom: 5px; }

  /* 全套 B：48dp，两键各 104dp、总 208dp 居中 */
  .phone[data-variant="b"] .tabbar { height: 48px; }
  .phone[data-variant="b"] .row { width: 208px; display: flex; }
  .phone[data-variant="b"] .tab { width: 104px; flex: none; }
  .phone[data-variant="b"] .tab svg { width: 20px; height: 20px; }
  .phone[data-variant="b"] .tab .gap { height: 2px; }
  .phone[data-variant="b"] .tab .lbl { font-size: 10.5px; line-height: 1.1; }
  .phone[data-variant="b"] .pill { width: 16px; height: 2.5px; bottom: 3px; }

  /* 只改高度 C：48dp，两键仍各占一半 */
  .phone[data-variant="c"] .tabbar { height: 48px; }
  .phone[data-variant="c"] .row { width: 100%; display: flex; }
  .phone[data-variant="c"] .tab { flex: 1; }
  .phone[data-variant="c"] .tab svg { width: 20px; height: 20px; }
  .phone[data-variant="c"] .tab .gap { height: 2px; }
  .phone[data-variant="c"] .tab .lbl { font-size: 10.5px; line-height: 1.1; }
  .phone[data-variant="c"] .pill { width: 16px; height: 2.5px; bottom: 3px; }

  .spec { margin-top: 14px; background: #fff; border: 1px solid #e4e4e7; border-radius: 12px; padding: 14px 16px; font-size: 13px; line-height: 1.9; color: #3f3f46; }
  .spec b { color: #18181b; }
  .spec table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px; }
  .spec th, .spec td { text-align: left; padding: 5px 4px; border-top: 1px solid #f0f0f0; }
  .spec th { color: #71717a; font-weight: 600; }
  .note { margin-top: 12px; font-size: 12px; line-height: 1.7; color: #71717a; }
</style>
</head>
<body>
<div class="page">
  <div class="pad">
  <h1>底部栏改小 · 样品</h1>
  <p class="sub">点上面三个按钮切换，看底部栏在手机里的实际样子。框里是简化课表，只为看栏；<b>1 CSS 像素 = 1 dp</b>，尺寸与真机一致。主题色取可可棕示意。</p>

  <div class="switch">
    <button data-v="a">现状<small>64dp · 各占一半</small></button>
    <button data-v="b" class="on">全套<small>48dp · 各 104dp 居中</small></button>
    <button data-v="c">只改高度<small>48dp · 仍各占一半</small></button>
  </div>
  </div>

  <div class="phone" data-variant="b" id="phone">
    <div class="appbar"><span>‹&nbsp; 第 12 周 · 单周</span><span class="dots">⋮</span></div>
    <div class="weekhead"><span></span><span>一</span><span class="today">二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="grid" id="grid"></div>
    <div class="tabbar">
      <div class="row" id="tabrow">
        <button class="tab sel" data-i="0" id="tab0">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg>
          <span class="gap"></span><span class="lbl">课表</span>
        </button>
        <button class="tab" data-i="1" id="tab1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/></svg>
          <span class="gap"></span><span class="lbl">设置</span>
        </button>
        <div class="pill" id="pill"></div>
      </div>
    </div>
  </div>

  <div class="pad">
  <div class="spec" id="spec"></div>
  <p class="note">补充：点「设置」可以试试小短条滑动；切回「课表」也一样。三种形态里按压反馈、选中实心图标、主题色小短条都不变；留白跟着栏高走，48dp 时一屏能多露 16dp 的课。</p>
  </div>
</div>

<script>
  // 简化课表：5 节时间行 × 7 天，塞 3 门课
  const times = ['08:00', '09:50', '10:40', '14:00', '15:50'];
  const grid = document.getElementById('grid');
  const courses = { '1-1': ['c-green', '大学英语', '16-201'], '2-3': ['c-blue', '有机化学', '16-102'], '4-2': ['c-purple', '药理学', '16-305'] };
  for (let r = 0; r < 5; r++) {
    const t = document.createElement('div');
    t.className = 't'; t.textContent = (r + 1) + '\n' + times[r];
    t.style.whiteSpace = 'pre-line';
    grid.appendChild(t);
    for (let d = 0; d < 7; d++) {
      const cell = document.createElement('div');
      cell.className = 'c';
      const key = r + '-' + d;
      if (courses[key]) {
        const [cls, name, room] = courses[key];
        cell.innerHTML = '<div class="course ' + cls + '"><b>' + name + '</b>' + room + '</div>';
        cell.style.borderTop = 'none';
      }
      grid.appendChild(cell);
    }
  }

  const SPECS = {
    a: '<b>现状：</b>栏高 64dp，图标 23dp，字 11.5sp，间距 4dp，小短条 20×3dp、距底 5dp，两键各占一半宽（约 187dp）。',
    b: '<b>全套（Argon 推荐）：</b>栏高 48dp，图标 20dp，字 10.5sp，间距 2dp，小短条 16×2.5dp、距底 3dp，两键各 104dp、总 208dp 居中。',
    c: '<b>只改高度：</b>栏高 48dp，图标 20dp，字 10.5sp，间距 2dp，小短条 16×2.5dp、距底 3dp，两键仍各占一半宽。'
  };
  const TABLE = '<table><tr><th></th><th>现状</th><th>全套</th><th>只改高度</th></tr>'
    + '<tr><td>栏高</td><td>64dp</td><td>48dp</td><td>48dp</td></tr>'
    + '<tr><td>图标字号</td><td>23dp / 11.5sp</td><td>20dp / 10.5sp</td><td>20dp / 10.5sp</td></tr>'
    + '<tr><td>按钮宽</td><td>各占一半</td><td>各 104dp 居中</td><td>各占一半</td></tr>'
    + '<tr><td>小短条</td><td>20×3dp</td><td>16×2.5dp</td><td>16×2.5dp</td></tr></table>';

  const phone = document.getElementById('phone');
  const pill = document.getElementById('pill');
  const spec = document.getElementById('spec');
  let variant = 'b', sel = 0;

  function layoutPill() {
    const row = document.getElementById('tabrow');
    const rw = row.offsetWidth, pw = pill.offsetWidth;
    let center;
    if (variant === 'b') center = (sel === 0 ? 52 : 156);
    else center = rw * (sel === 0 ? 0.25 : 0.75);
    pill.style.left = (center - pw / 2) + 'px';
  }
  function render() {
    phone.dataset.variant = variant;
    spec.innerHTML = SPECS[variant] + TABLE;
    requestAnimationFrame(layoutPill);
  }
  document.querySelectorAll('.switch button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.switch button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      variant = btn.dataset.v;
      render();
    });
  });
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      sel = +tab.dataset.i;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('sel', +t.dataset.i === sel));
      layoutPill();
    });
  });
  window.addEventListener('resize', layoutPill);
  render();
</script>
</body>
</html>
